{% extends "base.html" %}
{% block title %}Page Not Found – PlaceReady{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-code">404</div>
  <div class="error-emoji">🔍</div>
  <h1 class="error-title">Page Not Found</h1>
  <p class="error-sub">The page you're looking for doesn't exist or has been moved.</p>
  <div class="error-actions">
    <a href="javascript:history.back()" class="btn-secondary"><i class="bi bi-arrow-left"></i> Go Back</a>
    <a href="{{ url_for('index') }}" class="btn-primary"><i class="bi bi-house-fill"></i> Home</a>
  </div>
</div>
{% endblock %}
